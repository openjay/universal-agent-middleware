name: Release
# Verification only. A release is one frozen wheel and sdist that a maintainer uploads to PyPI and attaches, byte for
# byte, to the GitHub Release together with SHA256SUMS (GOVERNANCE.md, "Release Process"). This workflow neither builds
# nor publishes: a rebuild in CI would produce different bytes than the files PyPI already holds. It checks that the
# attached files, SHA256SUMS and the files PyPI serves are the same bytes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify, for example v0.6.3
        required: true
permissions:
  contents: read
jobs:
  verify-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Verify the release assets against SHA256SUMS and PyPI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python tools/verify_release_assets.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
