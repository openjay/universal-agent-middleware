name: Portable regression and wheel
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ripgrep (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      # tests/test_v061_immutable_build.py builds a wheel offline with build isolation off, so the backend that
      # pyproject.toml [build-system] requires must already be installed in the interpreter that runs pytest, and
      # there is no index to fetch it from inside those tests. A Python 3.12+ environment has no setuptools; a
      # Python 3.11 one has what ensurepip bundles (setuptools 65.5.0 in 3.11.9), which cannot build without
      # `wheel` (invalid command 'bdist_wheel').
      - name: Install service, test and build-backend dependencies
        run: python -m pip install -e '.[service]' pytest build 'setuptools>=68' wheel
      - name: Portable regression
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel
